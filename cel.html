<style>
  :root { --void:#070707; --bone:#f3f3f1; --snow:#fff; --ink:#1c1915; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--void); color:var(--bone); }
  body { font-family: Archivo, Helvetica, Arial, sans-serif; }
  button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
  img { display:block; max-width:100%; }
  .stage { min-height:100dvh; }
  .phone { position:relative; height:100dvh; overflow:hidden; background:var(--void); }
  .logo { height:26px; width:auto; }
  .logo.ink { filter:invert(1); }
  .panel { display:none; height:100%; }
  .panel.on { display:block; }
  .mark { position:absolute; z-index:5; top:0; left:0; padding:16px 16px 0; pointer-events:none; }
  .sky { position:relative; height:100%; overflow:hidden; padding-bottom:118px; }
  .card {
    position:absolute; z-index:1; left:50%; top:42%; width:var(--w); opacity:0;
    transform:translate(-50%,-50%) scale(.12);
    transition:left 1.05s cubic-bezier(.16,1,.3,1), top 1.05s cubic-bezier(.16,1,.3,1), transform 1.05s cubic-bezier(.16,1,.3,1), opacity .45s ease;
    transition-delay:var(--d);
  }
  .card.in { left:var(--x); top:var(--y); opacity:1; transform:translate(-50%,-50%) scale(1); }
  .card img { width:100%; aspect-ratio:16/9; object-fit:cover; }
  .card.film img { object-fit:contain; background:#000; }
  .bob { display:block; }
  .card.in .bob { animation:bob var(--dur) ease-in-out infinite alternate; }
  @keyframes bob {
    from { transform:translateY(-8px) rotate(var(--tilt)); }
    to { transform:translateY(10px) rotate(calc(var(--tilt) * -.4)); }
  }
  .junto, .fotos { height:100%; overflow-y:auto; padding-bottom:118px; }
  .letter { background:#000; }
  .letter img { width:100%; aspect-ratio:16/9; object-fit:contain; }
  .bleed img { width:100%; aspect-ratio:3/4; object-fit:cover; }
  .pair { display:grid; grid-template-columns:1fr 1fr; }
  .pair img { width:100%; height:46vw; max-height:240px; object-fit:cover; }
  .cine { height:100%; display:flex; flex-direction:column; gap:4px; padding-bottom:118px; }
  .cine .hero, .cine .other { min-height:0; background:#000; }
  .cine .hero { flex:1.05; }
  .cine .under { flex:1; min-height:0; display:flex; flex-direction:column; gap:4px; }
  .cine .other { flex:1; }
  .cine .hero img, .cine .other img { width:100%; height:100%; object-fit:contain; }
  .strip { display:flex; height:96px; flex:none; }
  .strip img { flex:1; width:0; height:100%; object-fit:cover; }
  .fotos { background:var(--bone); color:var(--ink); }
  .head { padding:16px 16px 10px; }
  .dock {
    position:absolute; left:0; right:0; bottom:0; z-index:20;
    background:rgba(7,7,7,.94);
    padding-bottom:max(8px, env(safe-area-inset-bottom));
  }
  .opts { display:flex; gap:6px; justify-content:center; padding:8px 8px 0; }
  .opts button { min-height:40px; padding:0 11px; border-radius:999px; border:1px solid var(--bone); font-size:13px; }
  .opts button.on { background:var(--snow); color:var(--void); border-color:var(--snow); }
  .contacto { min-height:40px; width:100%; font-size:13px; letter-spacing:.04em; }
  .pablo { width:100%; max-height:120px; object-fit:contain; background:#000; }
  @media (min-width:768px) {
    .stage { display:grid; min-height:100dvh; place-items:center; background:#121212; }
    .phone { width:390px; height:min(844px,100dvh); border-radius:28px; box-shadow:0 0 0 1px rgba(243,243,241,.4); }
    .pair img { height:160px; }
  }
  @media (prefers-reduced-motion:reduce) {
    .card, .card.in .bob { transition:none; animation:none; }
  }
</style>
</head>

const sky = [
  { src: films[0], x:"28%", y:"26%", w:"58%", tilt:"-5deg", dur:"6.2s", d:"0s", film:1 },
  { src: films[1], x:"74%", y:"46%", w:"50%", tilt:"4deg", dur:"7.4s", d:".1s", film:1 },
  { src: photos[0], x:"22%", y:"58%", w:"38%", tilt:"3deg", dur:"8s", d:".18s" },
  { src: photos[1], x:"72%", y:"64%", w:"36%", tilt:"-3deg", dur:"6.8s", d:".26s" },
  { src: photos[2], x:"46%", y:"36%", w:"34%", tilt:"2deg", dur:"7.6s", d:".14s" }
];
const skyEl = document.getElementById("sky");
sky.forEach((p) => {
  const el = document.createElement("div");
  el.className = "card" + (p.film ? " film" : "");
  ["--x","--y","--w","--tilt","--dur","--d"].forEach((k) => el.style.setProperty(k, p[{ "--x":"x","--y":"y","--w":"w","--tilt":"tilt","--dur":"dur","--d":"d" }[k]]));
  el.innerHTML = '<span class="bob"><img alt="" src="' + p.src + '"></span>';
  skyEl.appendChild(el);
});
let lead = 0;
function paintCine() {
  document.getElementById("hero").innerHTML = '<img alt="Comercial" src="' + films[lead] + '">';
  document.getElementById("other").innerHTML = '<img alt="Comercial" src="' + films[1 - lead] + '">';
  document.getElementById("strip").innerHTML = photos.map((s) => '<img alt="Fotografía" src="' + s + '">').join("");
}
paintCine();
function swap() { lead = 1 - lead; paintCine(); }
document.getElementById("hero").onclick = swap;
document.getElementById("other").onclick = swap;
function fly() {
  const cards = skyEl.querySelectorAll(".card");
  cards.forEach((c) => c.classList.remove("in"));
  void skyEl.offsetWidth;
  setTimeout(() => cards.forEach((c) => c.classList.add("in")), 70);
}
const names = ["Lejos", "Junto", "Cine", "Fotos"];
const ids = ["lejos", "junto", "cine", "fotos"];
const opts = document.getElementById("opts");
names.forEach((name, i) => {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = name;
  b.onclick = () => show(ids[i]);
  opts.appendChild(b);
});
function show(id) {
  document.querySelectorAll(".panel").forEach((p) => p.classList.toggle("on", p.id === id));
  [...opts.children].forEach((b, i) => b.classList.toggle("on", ids[i] === id));
  document.getElementById("pablo").style.display = "none";
  if (id === "lejos") fly();
}
document.getElementById("contacto").onclick = () => {
  const img = document.getElementById("pablo");
  img.style.display = img.style.display === "none" ? "block" : "none";
};
opts.children[0].classList.add("on");
</script>
